<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Nhiệm Vụ</title>
    <link rel="stylesheet" href="../css/task_mangager.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-title">
        <h1 onclick="goHome()">Quản Lý Dự Án</h1>
      </div>
      <nav class="header-nav">
        <a href="#" class="nav-link" onclick="switchpage()">Dự Án</a>
        <a href="#" class="nav-link active">Nhiệm Vụ của tôi</a>
        <a href="#" class="nav-link">Đăng Xuất</a>
      </nav>
    </header>

    <main class="main-content">
      <div class="content-container">
        <section class="section-header">
          <h2>Quản lý nhiệm vụ</h2>
        </section>

        <section class="actions-bar task-actions">
          <div class="action-group">
            <select class="select-sort">
              <option value="">Sắp xếp theo</option>
              <option value="priority">Độ ưu tiên</option>
              <option value="due_date">Hạn chót</option>
              <option value="start_date">Ngày bắt đầu</option>
            </select>
            <input
              type="text"
              class="search-input task-search"
              placeholder="Tìm kiếm nhiệm vụ"
            />
          </div>
        </section>

        <section class="task-list">
          <h2>Danh Sách Nhiệm Vụ</h2>
          <div class="table-wrapper">
            <table class="task-table">
              <thead>
                <tr>
                  <th class="col-task-name">Tên Nhiệm Vụ</th>
                  <th class="col-priority">Độ ưu tiên</th>
                  <th class="col-status">Trạng thái</th>
                  <th class="col-start-date">Ngày Bắt Đầu</th>
                  <th class="col-due-date">Hạn Chót</th>
                  <th class="col-progress">Tiến độ</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="col-task-name">Thiết kế giao diện</td>
                  <td class="col-priority">Cao</td>
                  <td class="col-status">Đang thực hiện</td>
                  <td class="col-start-date">2023-10-01</td>
                  <td class="col-due-date">2023-10-15</td>
                  <td class="col-progress">50%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <footer>© Quản lí dự án năm 2025 by VuHoaiNam</footer>
    <script>
      function goHome() {
        window.location.href = "./category_manager.html";
      }
      // function switchpage() {
      //   window.location.href = "./category_manager.html";
      // }
    </script>
  </body>
</html>
